<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Admin Sign In</title>

  <link
    rel="stylesheet"
    href="admin.css"
  />
</head>

<body>

  <main
    class="login-panel"
    aria-labelledby="loginTitle"
  >

    <section class="login-card">

      <p class="eyebrow">
        Restricted access
      </p>

      <h1 id="loginTitle">
        Admin Sign In
      </h1>


      <form id="loginForm">

        <label for="loginIdentifier">
          Email or Username
        </label>

        <input
          id="loginIdentifier"
          name="identifier"
          type="text"
          autocomplete="username"
          placeholder="Enter admin email"
          required
        />


        <label for="loginPassword">
          Password
        </label>

        <input
          id="loginPassword"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter password"
          required
        />


        <button
          id="loginButton"
          type="submit"
        >
          Sign In
        </button>


        <p
          id="loginStatus"
          class="login-status"
          role="alert"
          aria-live="polite"
        ></p>

      </form>

    </section>

  </main>


  <script src="adminLogin.js"></script>

</body>

</html>
